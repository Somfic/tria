# Slice material table. Index order is authoritative: entry 0 MUST be `air` with
# class = "empty". Names are fixed by the cross-agent contract:
#   air, water, sand, silt, grit, gold_dust, stone, bedrock, mesh, filter_paper,
#   cardboard, tin
#
# Units: density/grain_density kg/m^3 · viscosity water=1.0 · repose_angle degrees
#        grain_size µm · porosity aperture µm (0 = impermeable) · hardness Mohs-ish
#        absorbency 0..1 how readily it soaks up water (unrelated to porosity, which is
#        a sieve aperture: mesh passes grains but soaks nothing, cardboard the reverse)
#        temperatures degrees C · thermal_cond W/mK · heat_capacity J/kgK
#        elec_cond relative to copper=1.0 · solubility 0..1
# melt_pt / boil_pt / freeze_pt / ignition_pt / burn_products / thermal_cond /
# heat_capacity / elec_cond / solubility / reactivity_tags are parsed and ignored
# in the slice (no heat, fire, gas or chemistry stepping).

