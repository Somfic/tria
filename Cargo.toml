[workspace]
resolver = "3"
members = ["engine/*", "examples/*"]

[workspace.dependencies]
common = { path = "engine/common" }
goap = { path = "engine/goap" }
perception = { path = "engine/perception" }
pixelsim = { path = "engine/pixelsim" }
pixelview = { path = "engine/pixelview" }
bevy = { version = "0.18" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
